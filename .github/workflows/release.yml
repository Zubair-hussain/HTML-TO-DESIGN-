name: Release

# Auto-release once a deployment succeeds. Vercel's GitHub integration (or any
# deployment provider) emits `deployment_status`; we release on the successful
# production one. Manual runs are also allowed.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you cutting a manual release?"
        required: false
        default: "manual release"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    # Only on a successful production deployment, or a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       (github.event.deployment_status.environment == 'Production' ||
        github.event.deployment_status.environment == 'production'))
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Re-run the full gate so we never release a red build.
      - name: Lint, typecheck, test & build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve release commit
        id: commit
        run: |
          sha="${{ github.event.deployment_status.deployment.sha }}"
          if [ -z "$sha" ]; then sha="${{ github.sha }}"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}-${{ github.run_number }}
          name: v${{ steps.pkg.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ steps.commit.outputs.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
