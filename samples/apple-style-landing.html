<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apple Style Product Landing</title>
  </head>
  <body style="font-family: Arial; margin: 0; color: #1d1d1f; background-color: #f5f5f7;">
    <main>
      <section style="padding: 56px 24px; text-align: center; background-color: #ffffff;">
        <h1 style="font-size: 56px; margin: 0;">iPhone</h1>
        <p style="font-size: 24px; color: #6e6e73;">Built for Apple-style import testing.</p>
        <a href="https://www.apple.com/iphone/" style="color: #0066cc;">Learn more</a>
      </section>
      <section style="padding: 36px 24px; display: grid; gap: 16px;">
        <article style="background-color: #ffffff; padding: 28px; border-radius: 8px;">
          <h2 style="font-size: 28px;">Design tokens</h2>
          <p>Extract colors, fonts, text hierarchy, links, and layout nodes.</p>
        </article>
        <article style="background-color: #ffffff; padding: 28px; border-radius: 8px;">
          <h2 style="font-size: 28px;">Figma export</h2>
          <button style="background-color: #0071e3; color: white; padding: 12px 18px;">Create draft</button>
        </article>
      </section>
    </main>
  </body>
</html>
